<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tender Processing{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <!-- Bootstrap is kept for the details modal and toasts; the page itself is styled by style.css -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
        integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
  {% block styles %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="appbar">
    <div class="appbar-brand">
      <span class="appbar-mark" aria-hidden="true">TP</span>
      <span class="appbar-title">Tender Processing</span>
    </div>
    {% if company %}
    <!-- The company every verdict is checked against -->
    <div class="appbar-profile">
      <span class="appbar-label">Checking against</span>
      <span class="appbar-company" id="company-name">{{ company.name }}</span>
      <button type="button" class="appbar-button" id="company-edit">
        <i class="bi bi-pencil-square" aria-hidden="true"></i> Edit profile
      </button>
    </div>
    {% endif %}
    {% block appbar_actions %}{% endblock %}
  </header>

  <main class="page">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
